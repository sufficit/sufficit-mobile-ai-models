name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  go-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: android-tsgo/go.mod
          cache-dependency-path: android-tsgo/go.sum
      - run: cd android-tsgo && go test -race ./...
      - run: cd android-tsgo && go vet ./...
  android:
    runs-on: android-builder
    timeout-minutes: 30
    concurrency:
      group: ci-android-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      # JDK 17 + cmdline-tools/platform-35/build-tools 35.0.0 vêm na imagem do
      # runner (sufficit-ci/docker/runner-android-builder.Dockerfile) — os steps
      # de setup-java/setup-android foram removidos na migração do pool.
      - run: ./scripts/check-tsgo-aar.sh
      - run: cd android && ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
