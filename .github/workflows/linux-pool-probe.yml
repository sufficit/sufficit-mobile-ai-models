# Probe diagnóstico (descartável): será REMOVIDO após o teste.
# Objetivo: provar se sufficit-mobile-ai-models consegue rotear jobs para o
# grupo ci-fleet (pool linux-general). Se este probe ficar queued enquanto o
# android-pool-canary do mobile-vpn roda verde, a causa é a ausência do repo
# na lista selected-repositories do grupo — não o pool android-builder.
name: linux-pool-probe
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: linux-general
    timeout-minutes: 5
    steps:
      - name: Routing probe only
        run: |
          set -eux
          nproc
          uname -a
